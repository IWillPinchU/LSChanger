<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LSChanger</title>
    <style>
      html,
      body,
      #app {
        background: #0b0b0d;
      }
    </style>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <div id="titlebar" data-tauri-drag-region>
        <div class="titlebar-left">
          <div class="logo-icon">
             <svg class="app-mark" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true">
               <rect x="2.5" y="2.5" width="27" height="27" rx="7" fill="#101014" stroke="currentColor" stroke-width="2"/>
               <path d="M9 8v16h9" fill="none" stroke="#fff1f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
               <path d="M23 10c-1.5-1.2-5.7-1.7-7.4.2-1.8 2 .2 4.1 3.1 4.9 3.2.9 5.2 2.5 4.1 5.3-1 2.5-5.9 3.2-9.2.8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
             </svg>
          </div>
          <div class="titlebar-label">LSChanger</div>
        </div>
        <div class="titlebar-controls">
          <div class="titlebar-button" id="titlebar-minimize">
            <svg width="12" height="12" viewBox="0 0 12 12"><rect fill="currentColor" x="2" y="5.5" width="8" height="1"/></svg>
          </div>
          <div class="titlebar-button" id="titlebar-maximize">
            <svg width="12" height="12" viewBox="0 0 12 12"><path fill="currentColor" d="M2 2h8v8H2V2zm1 1v6h6V3H3z"/></svg>
          </div>
          <div class="titlebar-button" id="titlebar-close">
            <svg width="12" height="12" viewBox="0 0 12 12"><path fill="currentColor" d="M2.5 2.5l7 7m0-7l-7 7" stroke="currentColor" stroke-width="1.2"/></svg>
          </div>
        </div>
      </div>

      <div class="layout">
        <aside class="sidebar">
          <div class="sidebar-search">
            <div class="search-container">
              <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="search-input" placeholder="Search..." />
            </div>
          </div>
          
          <div class="sidebar-scrollable">
            <div class="sidebar-section">
              <div class="section-title">SORT</div>
              <div class="pill-group">
                <button class="pill active sort-btn" data-sort="alphabetical">Alphabetical</button>
                <button class="pill sort-btn" data-sort="date">By Date</button>
                <button class="pill sort-btn" data-sort="size">Size</button>
                <button class="pill sort-btn" data-sort="resolution">Resolution</button>
              </div>
            </div>

            <div class="sidebar-section">
              <div class="section-title">TYPE</div>
              <div class="pill-group">
                <button class="pill active filter-btn" data-filter="all">All</button>
                <button class="pill filter-btn" data-filter="landscape">Landscape</button>
                <button class="pill filter-btn" data-filter="portrait">Portrait</button>
              </div>
            </div>

            <div class="sidebar-section">
              <div class="section-title folder-section-title">
                <span>FOLDERS</span>
                <div class="folder-section-actions">
                  <button class="sidebar-icon-btn" id="folder-search-toggle" type="button" title="Search folders">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  </button>
                  <button class="sidebar-icon-btn" id="add-folder-sidebar" type="button" title="Add folder">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                  </button>
                </div>
              </div>
              <div class="folder-search-panel" id="folder-search-panel">
                <input type="text" id="folder-search-input" placeholder="Find folder..." />
                <button class="sidebar-icon-btn" id="folder-search-clear" type="button" title="Clear folder search">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
              </div>
              <div class="folder-list" id="folder-list">
                <button class="folder-item" type="button" disabled>No folder selected</button>
              </div>
            </div>
          </div>

          <div class="sidebar-footer">
            <div class="stats" id="image-count">0 wallpapers</div>
            <button class="settings-btn" id="btn-settings">
              <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              Settings
            </button>
          </div>
        </aside>
        <div class="sidebar-resize-handle" id="sidebar-resize-handle" title="Drag to resize sidebar"></div>

        <main class="main-content">
          <header class="content-header">
            <div class="header-left">
              <div class="header-text">
                <span id="current-folder-name">No Folder Selected</span>
                <span class="header-separator">-</span>
                <span id="current-folder-path">Add a folder to view images</span>
              </div>
            </div>
            <div class="header-right">
              <div class="nav-arrows">
                <button class="nav-arrow" id="refresh-btn" title="Refresh">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.6 6.1"/><path d="M3 12a9 9 0 0 1 15.6-6.1"/><path d="M3 18v-6h6"/><path d="M21 6v6h-6"/></svg>
                </button>
                <button class="nav-arrow" id="page-prev" disabled>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <button class="nav-arrow" id="page-next" disabled>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
              </div>
              <button class="btn-see-all" id="see-all-btn" disabled>See all</button>
            </div>
          </header>

          <div class="image-grid" id="image-grid">
             <div class="empty-state">
               <div class="empty-illustration">
                 <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
               </div>
               <h2>Empty Gallery</h2>
               <p>Select a folder in Settings to start managing your lock screen images.</p>
               <button class="btn-outline" onclick="document.getElementById('btn-settings').click()">Open Settings</button>
             </div>
          </div>
        </main>
      </div>

      <!-- Settings Modal Overlay -->
      <div id="settings-overlay" class="modal-overlay">
        <div class="modal-content">
          <div class="modal-header">
            <button id="select-folder-settings" class="settings-add-folder-btn">
              <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              Add Folder
            </button>
            <button id="close-settings" class="settings-close-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <div class="modal-body">
            <div class="setting-group">
              <div class="settings-source-list" id="settings-source-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>
  </body>
</html>
